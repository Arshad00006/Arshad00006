name: Update Profile Cards

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/**"
      - ".github/workflows/activity-radar.yml"

concurrency:
  group: profile-cards
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Generate activity radar
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
        run: python3 scripts/generate_radar.py

      - name: Generate stats, languages, streak, trophies, graph, badges and project cards
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
        run: python3 scripts/generate_cards.py

      - name: Generate typing banner
        run: python3 scripts/make_typing.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A assets README.md
          git diff --cached --stat
          git commit -m "chore: refresh profile cards" || { echo "No changes to commit"; exit 0; }
          git pull --rebase
          git push
