<svg xmlns="http://www.w3.org/2000/svg" width="880" height="176" viewBox="0 0 880 176" role="img" aria-label="Contribution streak">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F78166"/><stop offset="1" stop-color="#BC8CFF"/></linearGradient>
  </defs>
  <rect x="0.5" y="0.5" width="879" height="175" rx="20" fill="#0D1117" stroke="#21262D"/>
  <line x1="293" y1="28" x2="293" y2="148" stroke="#21262D"/>
  <line x1="587" y1="28" x2="587" y2="148" stroke="#21262D"/>

  <text x="147" y="86" text-anchor="middle" font-family="'Segoe UI',Ubuntu,Helvetica,Arial,sans-serif" font-size="34" font-weight="800" fill="#E6EDF3">57</text>
  <text x="147" y="116" text-anchor="middle" font-family="'Segoe UI',Ubuntu,Helvetica,Arial,sans-serif" font-size="13" fill="#C9D1D9">Total Contributions</text>
  <text x="147" y="138" text-anchor="middle" font-family="'Segoe UI',Ubuntu,Helvetica,Arial,sans-serif" font-size="11" fill="#6E7681">Oct 26, 2025 to today</text>

  <circle cx="440" cy="66" r="42" fill="none" stroke="#21262D" stroke-width="7"/>
  <circle cx="440" cy="66" r="42" fill="none" stroke="url(#g)" stroke-width="7" stroke-linecap="round"
          stroke-dasharray="131.9 263.9" transform="rotate(-90 440 66)">
    <animate attributeName="stroke-dasharray" from="0 263.9" to="131.9 263.9" dur="1.2s" fill="freeze"/>
  </circle>
  <text x="440" y="78" text-anchor="middle" font-family="'Segoe UI',Ubuntu,Helvetica,Arial,sans-serif" font-size="34" font-weight="800" fill="#E6EDF3">1</text>
  <text x="440" y="134" text-anchor="middle" font-family="'Segoe UI',Ubuntu,Helvetica,Arial,sans-serif" font-size="13" fill="#F78166">Current Streak</text>
  <text x="440" y="154" text-anchor="middle" font-family="'Segoe UI',Ubuntu,Helvetica,Arial,sans-serif" font-size="11" fill="#6E7681">Oct 27</text>

  <text x="733" y="86" text-anchor="middle" font-family="'Segoe UI',Ubuntu,Helvetica,Arial,sans-serif" font-size="34" font-weight="800" fill="#E6EDF3">2</text>
  <text x="733" y="116" text-anchor="middle" font-family="'Segoe UI',Ubuntu,Helvetica,Arial,sans-serif" font-size="13" fill="#C9D1D9">Longest Streak</text>
  <text x="733" y="138" text-anchor="middle" font-family="'Segoe UI',Ubuntu,Helvetica,Arial,sans-serif" font-size="11" fill="#6E7681">Oct 21 to Oct 22</text>
</svg>
